# Qt app release. Push a tag `qt-v<version>` (the version in qt/phystrack_qt/version.py). This builds the
# app on each OS, signs it where the signing secrets are set, and attaches the packages to a GitHub
# release. A missing secret skips that signing step (the package is then unsigned); it does not fail.
# Setup for each secret: qt/packaging/README.md.
name: Qt app release

on:
  push:
    tags: ["qt-v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # Azure login for Windows signing (OIDC, no stored password)

jobs:
  check-version:
    name: The tag matches the app's version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' qt/phystrack_qt/version.py)
          if [ "qt-v$version" != "$TAG" ]; then
            echo "The tag $TAG does not match qt/phystrack_qt/version.py ($version)." >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120   # Tests, build, signing and Apple's notarization, which can queue
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: qt
    env:
      # Signing secrets. Empty when unset; the steps that use them are skipped then.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: qt/uv.lock

      - name: Python
        run: uv python install 3.12

      - name: Qt's system libraries and AppImage tool (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 fuse libfuse2
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      # Before the project is built: its wheel includes these models, so the fetch cannot need the project
      - name: The models the app ships with
        run: uv run --no-project --with colorlog python build.py models

      - name: Tests (the release is not built if they fail)
        env:
          PYTHONUTF8: "1"
        run: uv run python build.py test

      - name: Build the app
        run: uv run --group build python build.py build

      # macOS: the Developer ID certificate in a temporary keychain, then sign, notarize and staple
      - name: Import the Developer ID certificate (macOS)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          keychain="$RUNNER_TEMP/build.keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          key="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_KEY_P8" > "$key"
          xcrun notarytool store-credentials phystrack-notary \
            --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          rm "$key"

      - name: Sign and notarize the app (macOS)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          PHYSTRACK_CODESIGN_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          PHYSTRACK_NOTARY_PROFILE: phystrack-notary
        run: uv run --group build python build.py sign

      # Windows: Azure Artifact Signing (formerly Trusted Signing), on the program and its libraries
      - name: Log in to Azure (Windows signing)
        if: runner.os == 'Windows' && env.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the program and libraries (Windows)
        if: runner.os == 'Windows' && env.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: ${{ env.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}/qt/build/dist/PhysTrackX
          files-folder-filter: exe,dll,pyd
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package (on Windows, the zip and the installer)
        run: uv run --group build python build.py package

      # The installer is signed after it is built: the program inside it is already signed above
      - name: Sign the installer (Windows)
        if: runner.os == 'Windows' && env.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: ${{ env.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}/qt/build/PhysTrackX-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: |
            qt/build/*.dmg
            qt/build/*.zip
            qt/build/*.tar.gz
            qt/build/*.AppImage
            qt/build/PhysTrackX-Setup.exe
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
          fail_on_unmatched_files: true
